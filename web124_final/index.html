<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>
    <header>
        <h1>JavaScript Calculator</h1>
    </header>
    <main>
        <div class="inputFlex">
            <label for="num">Enter your number</label>
            <input type="number" id="num">
            <button class="myButton">Calculate</button>
        </div>
        <div class="results">
            <p class="res" id="add">Addition</p>
            <p class="res" id="sub">Substraction</p>
            <p class="res" id="mult">Multiplication</p>
            <p class="res" id="div">Division</p>
        </div>
    </main>
    <footer>
        <p>&copy; 2025 Gana Sehaki Calculator</p>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
